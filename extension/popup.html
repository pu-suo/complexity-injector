<!doctype html>
<meta charset="utf-8">
<title>Complexity Injector</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 236px; }
  h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between;
         padding: 8px 0 12px; border-bottom: 1px solid rgba(128,128,128,.25); }
  #state { font-weight: 600; }
  dl { display: grid; grid-template-columns: auto auto; gap: 3px 10px; margin: 12px 0 0; }
  dt { opacity: .65; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #count { font-weight: 600; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; cursor: pointer; border-radius: 22px;
            background: rgba(128,128,128,.45); transition: background .15s; }
  .slider::before { content: ""; position: absolute; height: 18px; width: 18px;
            left: 2px; top: 2px; background: #fff; border-radius: 50%;
            transition: transform .15s; }
  input:checked + .slider { background: #2f6fdb; }
  input:checked + .slider::before { transform: translateX(18px); }
  input:focus-visible + .slider { outline: 2px solid #2f6fdb; outline-offset: 2px; }
</style>
<h1>Complexity Injector</h1>
<div class="row">
  <span id="state">On</span>
  <label class="switch">
    <input type="checkbox" id="toggle" checked>
    <span class="slider"></span>
  </label>
</div>
<dl>
  <dt>Words replaced</dt><dd id="count">&hellip;</dd>
  <dt>Backend</dt><dd id="backend">&hellip;</dd>
</dl>
<script src="popup.js" type="module"></script>
